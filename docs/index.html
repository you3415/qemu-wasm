<!doctype html>
<html lang="ja">
<head>
<title>64bit ISO Emulator (x86_64 QEMU Wasm)</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="./vendor/xterm.css">
</head>
<body class="bg-dark text-light">
<main class="container py-4">

  <h1 class="h3 mb-3">64bit ISO Emulator (x86_64)</h1>

  <div id="env_alert" class="alert alert-danger d-none" role="alert"></div>

  <div class="card bg-secondary text-white mb-4">
    <div class="card-body">
      <div class="row g-2 align-items-center">
        <div class="col-auto">
          <label for="iso_file" class="col-form-label fw-bold">64bit ISOファイル:</label>
        </div>
        <div class="col-auto">
          <input class="form-control" type="file" id="iso_file" accept=".iso">
        </div>
        <div class="col-auto">
          <label for="ram_size" class="col-form-label">RAM (MB):</label>
        </div>
        <div class="col-auto">
          <input class="form-control" type="number" id="ram_size" value="512" min="128" max="2048" style="width: 100px;">
        </div>
        <div class="col-auto">
          <button class="btn btn-primary fw-bold" id="start_btn" disabled>エミュレータ起動</button>
        </div>
      </div>
      <div id="status_text" class="mt-2 small text-warning">ISOファイルを選択してください（※シリアルコンソール対応のOSが表示されます）</div>
    </div>
  </div>

  <div class="d-inline-block border border-secondary" id="terminal-alpine-x86_64"></div>

</main>

<script src="./coi-serviceworker.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-pty@0.9.4/index.js" crossorigin="anonymous"></script>
<script src="./alpine-x86_64-module.js"></script>
<script src="./images/alpine-x86_64/load-rom.js"></script>

<script type="module">
  const isoInput = document.getElementById("iso_file");
  const startBtn = document.getElementById("start_btn");
  const ramInput = document.getElementById("ram_size");
  const statusText = document.getElementById("status_text");
  const envAlert = document.getElementById("env_alert");

  let isoUint8Array = null;

  async function checkRequiredFiles() {
    const requiredFiles = [
      './alpine-x86_64-module.js',
      './images/alpine-x86_64/load-rom.js',
      './images/alpine-x86_64/out.js'
    ];
    const missing = [];

    for (const path of requiredFiles) {
      try {
        const res = await fetch(path, { method: 'HEAD' });
        if (!res.ok) missing.push(`${path} (HTTP ${res.status})`);
      } catch (e) {
        missing.push(`${path} (取得失敗)`);
      }
    }

    if (missing.length > 0) {
      envAlert.classList.remove("d-none");
      envAlert.innerHTML = `<strong>必要なファイルが見つかりません：</strong><ul class="mb-0 mt-1">${missing.map(m => `<li><code>${m}</code></li>`).join('')}</ul>`;
    }
  }
  checkRequiredFiles();

  isoInput.addEventListener("change", async (e) => {
    const file = e.target.files?.item(0);
    if (!file) return;

    statusText.textContent = `読み込み中: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)...`;
    startBtn.disabled = true;

    try {
      const buffer = await file.arrayBuffer();
      isoUint8Array = new Uint8Array(buffer);

      statusText.textContent = `準備完了: ${file.name} — 「エミュレータ起動」を押してください`;
      startBtn.disabled = false;
    } catch (err) {
      statusText.textContent = "ファイルの読み込みに失敗しました: " + (err?.message || err);
    }
  });

  window.Module = window.Module || {};
  let xterm = null;

  try {
    xterm = new window.Terminal({ cols: 100, rows: 30 });
    xterm.open(document.getElementById("terminal-alpine-x86_64"));

    const { master, slave } = window.openpty();
    xterm.loadAddon(master);
    window.Module.pty = slave;
  } catch (err) {
    statusText.textContent = "ターミナルの初期化に失敗しました: " + (err?.message || err);
  }

  function patchTTY(mod) {
    if (mod.TTY && mod.TTY.stream_ops && !mod.TTY.stream_ops._patched) {
      const oldPoll = mod.TTY.stream_ops.poll;
      const pty = mod.pty;
      mod.TTY.stream_ops.poll = function(stream, timeout) {
        if (!pty.readable) {
          return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 0);
        }
        return oldPoll.call(this, stream, timeout);
      };
      mod.TTY.stream_ops._patched = true;
    }
  }

  startBtn.addEventListener("click", async () => {
    if (!isoUint8Array) return;
    startBtn.disabled = true;
    isoInput.disabled = true;
    statusText.textContent = "QEMU (x86_64) を起動しています...";

    const parsedRam = parseInt(ramInput.value, 10);
    const ramMB = Number.isNaN(parsedRam) ? 512 : Math.min(2048, Math.max(128, parsedRam));
    ramInput.value = ramMB;

    window.Module.arguments = [
      '-L', '/pack',
      '-m', `${ramMB}M`,
      '-cdrom', '/iso/boot.iso',
      '-boot', 'd',
      '-nographic',
      '-serial', 'mon:stdio'
    ];

    window.Module.preRun = window.Module.preRun || [];
    window.Module.preRun.push((mod) => {
      try { mod.FS.mkdir('/iso'); } catch (e) {}
      mod.FS.writeFile('/iso/boot.iso', isoUint8Array);
      patchTTY(mod);
    });

    const prevOnRuntimeInitialized = window.Module.onRuntimeInitialized;
    window.Module.onRuntimeInitialized = function() {
      if (typeof prevOnRuntimeInitialized === 'function') {
        prevOnRuntimeInitialized.apply(this, arguments);
      }
      patchTTY(window.Module);
      statusText.textContent = "起動完了（画面が表示されない場合は数秒待つか、ターミナルをクリックしてEnterキーを押してください）";
      if (xterm) xterm.focus();
    };

    try {
      const { default: initEmscriptenModule } = await import('./images/alpine-x86_64/out.js');
      await initEmscriptenModule(window.Module);
    } catch (err) {
      statusText.textContent = "エラーが発生しました: " + (err?.message || err);
      console.error(err);
      startBtn.disabled = false;
      isoInput.disabled = false;
    }
  });
</script>
</body>
</html>
